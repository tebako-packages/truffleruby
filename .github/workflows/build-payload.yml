name: build-payload
# truffleruby feedstock: fetch → stage → image → smoke → (on tags) publish.
# One mechanical leg per (flavor × platform) — the flavor names the MODE:
# native (the exe-relative native-image launcher) and jvm (TODO.truffleruby/03
# — spec 33's runtime-on-runtime form: env image composed ON the published
# graalvm java owner; its legs' smoke is the COMPOSED wire — shim → dep
# runtime → owner — plus the spec 33 §5 standalone fail-closed negative
# gate). Platforms aarch64-macos + x86_64-linux-gnu (+ aarch64-linux-gnu
# native only; upstream ships NO windows and NO macos-x86_64 truffleruby
# build, and the jvm legs follow the graalvm owner's coverage — the matrix
# is the declarative truth, not an omission).
#
# kind: runtime (spec 28/29): each leg ships the PAIR — the wrapper exe
# (tebako-runtime-launcher) + the env image (.tfs) + sidecars + the
# release shard. The publish job uploads the pair, derives the release
# monoliths (manifest.json + SHA256SUMS.txt, trr#140) from the shards,
# renders the registry entry from manifests/registry.yaml, and lands it
# by bot PR. `tebako publish` is NOT used: the CLI refuses kind: runtime
# (runtimes publish through the runtime release flow).
#
# PIN DISCIPLINE (the owner's rule): this workflow carries NO version or
# digest literals. recipe.yml is the SSOT — the `tools:` block pins the
# tfs CLI + the link-unit tarball (release + per-platform sha256), the
# `runtime:` block pins the wrapper's product line; tools/pins.rb reads
# them into $GITHUB_ENV and the fetch steps cross-check the pins against
# the release's own SHA256SUMS where the monolith covers the asset (the
# link-unit tarballs are NOT in it — the recipe pin is their anchor; the
# upstream truffleruby archives carry NO published sums either — the
# recipe pin is theirs).
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.flavor }} / ${{ matrix.platform.triplet }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # Identity only (which leg, which runner, which flavor). All
        # versions/digests flow from recipe.yml via tools/pins.rb. The
        # jvm flavor (spec 33) ships TWO legs: the graalvm owner pair its
        # composed smoke needs exists for macos-arm64 + linux-gnu-x86_64
        # only (openjdk-graalvm 25.0.4.1 has no linux-arm64 leg — the
        # truffleruby-jvm aarch64-linux-gnu leg is a named follow-up
        # gated on the owner, declared in recipe.yml, never omitted
        # silently).
        flavor: [native, jvm]
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-14
          - triplet: x86_64-linux-gnu
            asset_platform: linux-gnu-x86_64
            os: ubuntu-24.04
          - triplet: aarch64-linux-gnu
            asset_platform: linux-gnu-arm64
            os: ubuntu-24.04-arm
        exclude:
          - flavor: jvm
            platform:
              triplet: aarch64-linux-gnu
              asset_platform: linux-gnu-arm64
              os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # recipe.yml's tools block is the toolchain pin SSOT; pins.rb emits
      # TEBAKO_RELEASE, PKG_NAME/PKG_VERSION, the per-platform
      # TFS_ASSET/TFS_SHA256 + LINK_UNIT_ASSET/LINK_UNIT_SHA256 for THIS
      # leg's asset_platform, the wrapper pin (WRAPPER_RELEASE/
      # WRAPPER_ASSET), the RUNTIME_STEM naming base, and PRELOAD_SHIM.
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        shell: bash
        run: ruby tools/pins.rb "${{ matrix.platform.asset_platform }}" "${{ matrix.flavor }}" --env >> "$GITHUB_ENV"

      # The imager (tfs mkimage/extract) is the product repo's own
      # published binary — releases are the interface; the feedstock
      # never builds the tebako stack from source. The pin flows from
      # recipe.yml and is cross-checked against the release's SHA256SUMS,
      # like the recipe pins the truffleruby archive's.
      - name: Fetch the imager (pinned by recipe.yml, sha256-verified)
        shell: bash
        env:
          TFS_BIN: .packager/tfs
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o "$TFS_BIN" "$base/$TFS_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TFS_SHA256  $TFS_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          # The pin must agree with the release's own sums (both anchored).
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: recipe.yml=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x "$TFS_BIN"
          # Bare invocation prints the help and exits 0 (tfs has no
          # --version flag): the dead-binary smoke, here where the
          # download just happened, not inside the payload step.
          "$TFS_BIN" > /dev/null

      # The wrapper exe — the runtime pair's process entry point (spec
      # 29). Same releases-are-the-interface rule as the imager; the
      # recipe's runtime.wrapper_tebako pin names the line.
      - name: Fetch the wrapper (pinned by recipe.yml)
        shell: bash
        env:
          WRAPPER_BIN: .packager/tebako-runtime-launcher
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$WRAPPER_RELEASE"
          curl -sL --fail -o "$WRAPPER_BIN" "$base/$WRAPPER_ASSET"
          echo "$WRAPPER_SHA256  $WRAPPER_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          chmod +x "$WRAPPER_BIN"
          echo "WRAPPER_BIN=$WRAPPER_BIN" >> "$GITHUB_ENV"

      # The preload shim: the link-unit tarball carries libtfs_preload
      # for the layout's preload_shim grant — the jail's host-IO binding
      # survives the exec into the interpreter. NOT in the release's
      # SHA256SUMS monolith: the recipe pin is the anchor.
      - name: Fetch the preload shim (link-unit, pinned by recipe.yml)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o .packager/link-unit.tar.gz "$base/$LINK_UNIT_ASSET"
          echo "$LINK_UNIT_SHA256  .packager/link-unit.tar.gz" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          tar -xzf .packager/link-unit.tar.gz -C .packager
          [ -f "$PRELOAD_SHIM" ] || { echo "::error::link-unit tarball carries no $PRELOAD_SHIM"; exit 1; }

      # The dispatcher for the jvm legs' composed smoke (spec 33's real
      # wire: shim → dep runtime → owner runtime). Same two-anchor rule
      # as the imager: the recipe pin AND the release's own SHA256SUMS.
      - name: Fetch the dispatcher (tebako-shim, jvm legs only)
        if: matrix.flavor == 'jvm'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o .packager/tebako-shim "$base/$TEBAKO_SHIM_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TEBAKO_SHIM_SHA256  .packager/tebako-shim" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          got=$(awk -v a="$TEBAKO_SHIM_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TEBAKO_SHIM_SHA256" ] || { echo "::error::pin mismatch for $TEBAKO_SHIM_ASSET: recipe.yml=$TEBAKO_SHIM_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x .packager/tebako-shim
          echo "SHIM_BIN=$PWD/.packager/tebako-shim" >> "$GITHUB_ENV"

      - name: Build the runtime pair
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          TFS_CLI: .packager/tfs
          FLAVOR: ${{ matrix.flavor }}
        # WRAPPER_BIN (the fetch step) and PRELOAD_SHIM (pins.rb) flow
        # through $GITHUB_ENV — process env, not the static env: context.
        run: tools/build

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.flavor }}-${{ matrix.platform.triplet }}
          path: out/${{ matrix.flavor }}-${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The runtime release flow (spec 28 §6): the tag IS the tebako
      # product line (v<line>, the trr convention — the resolver's
      # {base}/v<tebako_version>/<asset> URL shape answers it). The two
      # flavors ride DIFFERENT lines (native 2.4.0, jvm 2.5.0 — the mode
      # rides the tebako line, spec 28 §8), so a tag publishes exactly ONE
      # flavor: the one whose wrapper_tebako equals the tag's version.
      # The other flavor's legs still ran (every tag proves both build),
      # but their artifacts are CI-only here — the published flavor's
      # sibling registry entry on main stays BYTE-STABLE (the java/06
      # acceptance principle).
      - name: Select the flavor this tag ships (the tag IS the wrapper line)
        shell: bash
        run: |
          set -euo pipefail
          tag_line="${GITHUB_REF_NAME#v}"
          pub=""
          for f in native jvm; do
            line=$(ruby tools/pins.rb macos-arm64 "$f" --env | grep '^WRAPPER_RELEASE=' | cut -d= -f2)
            if [ "${line#v}" = "$tag_line" ]; then
              [ -z "$pub" ] || { echo "::error::tag $GITHUB_REF_NAME matches BOTH flavors' wrapper lines — the mode-line mapping is broken"; exit 1; }
              pub="$f"
            fi
          done
          [ -n "$pub" ] || { echo "::error::tag $GITHUB_REF_NAME matches no flavor's wrapper line (recipe.yml)"; exit 1; }
          echo "PUBLISH_FLAVOR=$pub" >> "$GITHUB_ENV"
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        run: ruby tools/pins.rb macos-arm64 "$PUBLISH_FLAVOR" --env >> "$GITHUB_ENV"
      - name: Create the release + upload the runtime pairs
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release create "$tag" --repo tamatebako/tebako-runtime-truffleruby \
            --title "$tag — tebako-runtime truffleruby (TruffleRuby Community $PKG_VERSION, $PUBLISH_FLAVOR mode)" \
            --notes "tebako ruby runtime pair (wrapper exe + env image) per platform — implementation truffleruby, $PUBLISH_FLAVOR mode; manifest.json is the release index, SHA256SUMS.txt the trust anchor." \
            || gh release view "$tag" --repo tamatebako/tebako-runtime-truffleruby > /dev/null
          for shard in out/$PUBLISH_FLAVOR-*/tebako-runtime-*.manifest.json; do
            dir="$(dirname "$shard")"
            stem="$(basename "$shard" .manifest.json)"
            # "$stem"* = the exe, the .tfs, both .sha256 sidecars, the
            # shard — never the sibling payload-<flavor>-<triplet>.yaml.
            gh release upload --clobber "$tag" --repo tamatebako/tebako-runtime-truffleruby "$dir/$stem"*
          done
      - name: Derive + upload the monoliths (manifest.json + SHA256SUMS.txt)
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ruby -rjson -e 'puts JSON.pretty_generate(ARGV.sort.map { |f| JSON.parse(File.read(f)) })' \
            out/$PUBLISH_FLAVOR-*/tebako-runtime-*.manifest.json > manifest.json
          cat out/$PUBLISH_FLAVOR-*/tebako-runtime-*.sha256 > SHA256SUMS.txt
          gh release upload --clobber "$tag" --repo tamatebako/tebako-runtime-truffleruby manifest.json SHA256SUMS.txt
      # The registry mirrors resolution fields only (L3): the env image
      # is the named artifact per platform; kind: runtime carries NO
      # entrypoints key (the validator: only apps and toolkits declare
      # entrypoints). Replace-or-append THIS flavor's entry on top of
      # origin/main's document — the sibling flavor's entry (and any
      # other) stays byte-stable. Entry blocks open with `- name: <n>` at
      # column 0 and run to the next entry or EOF.
      - name: Render the registry entry
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          sha_for() { cut -d' ' -f1 "out/$1/$2.tfs.sha256"; }
          if [ "$PUBLISH_FLAVOR" = jvm ]; then
            tpl=manifests/registry-jvm.yaml
            sed -e "s|@@VERSION@@|$PKG_VERSION|g" \
                -e "s|@@STEM@@|$RUNTIME_STEM_BASE|g" \
                -e "s|@@TAG@@|$tag|g" \
                -e "s|@@SHA256_MACOS@@|$(sha_for jvm-aarch64-macos "$RUNTIME_STEM_BASE-macos-arm64")|g" \
                -e "s|@@SHA256_LINUX@@|$(sha_for jvm-x86_64-linux-gnu "$RUNTIME_STEM_BASE-linux-gnu-x86_64")|g" \
                "$tpl" > rendered-entry.yaml
          else
            tpl=manifests/registry.yaml
            sed -e "s|@@VERSION@@|$PKG_VERSION|g" \
                -e "s|@@STEM@@|$RUNTIME_STEM_BASE|g" \
                -e "s|@@TAG@@|$tag|g" \
                -e "s|@@SHA256_MACOS@@|$(sha_for native-aarch64-macos "$RUNTIME_STEM_BASE-macos-arm64")|g" \
                -e "s|@@SHA256_LINUX@@|$(sha_for native-x86_64-linux-gnu "$RUNTIME_STEM_BASE-linux-gnu-x86_64")|g" \
                -e "s|@@SHA256_LINUX_ARM@@|$(sha_for native-aarch64-linux-gnu "$RUNTIME_STEM_BASE-linux-gnu-arm64")|g" \
                "$tpl" > rendered-entry.yaml
          fi
          # The template renders the full document for the FIRST publish;
          # afterwards main's doc is the base and this flavor's entry is
          # replace-or-appended. The appended form is the entry block only
          # (from its `- name:` line — the registry is an L3 mirror:
          # resolution fields, no commentary; the template files carry the
          # comments).
          git fetch origin main
          if git show origin/main:tpkg-registry.yaml > reg-main.yaml 2>/dev/null; then
            entry_name=$(grep -m1 '^- name: ' rendered-entry.yaml | sed 's/^- name: *//')
            sed -n '/^- name: /,$p' rendered-entry.yaml > entry-only.yaml
            awk -v entry="- name: $entry_name" '
              /^- name: / { skip = ($0 == entry) ? 1 : 0 }
              !skip { print }
            ' reg-main.yaml > reg-trimmed.yaml
            cat reg-trimmed.yaml entry-only.yaml > tpkg-registry.yaml
          else
            cat rendered-entry.yaml > tpkg-registry.yaml
          fi
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry"
          # force-with-lease on the bot branch: a re-publish re-creates it
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
